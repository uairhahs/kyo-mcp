[project]
name = "kyo-mcp"
version = "0.1.0"
description = "An MCP server implementing the Open Knowledge Format (OKF) specification."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "appdirs>=1.4.4",
  "bandit>=1.9.4",
  "fastapi>=0.140.0",
  "httptools>=0.8.0",
  "mcp>=2.0.0",
  "mnemosyne-memory>=3.15.1",
  "networkx>=3.6.1",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "requests>=2.34.2",
  "uvicorn>=0.51.0",
  "uvloop>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kyo-mcp = "kyo_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["kyo_mcp"]

[tool.hatch.envs.test]
dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "appdirs>=1.4.4",
]

[tool.hatch.envs.test.scripts]
test = "pytest tests/ -v"
test-coverage = "pytest tests/ --cov=kyo_mcp --cov-report=term-missing"

[tool.hatch.envs.default.scripts]
start = "python -m kyo_mcp.mcp_server"
lint = "ruff check kyo_mcp/"
format = "ruff format kyo_mcp/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["coverage>=7.15.2", "pytest-asyncio>=1.4.0"]
