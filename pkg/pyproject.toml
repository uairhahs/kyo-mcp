[project]
name = "kyo-mcp"
version = "0.1.0"
description = "An MCP server implementing the Open Knowledge Format (OKF) specification."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.140.0",
  "graphviz>=0.21",
  "httptools>=0.8.0",
  "langchain-community>=0.4.2",
  "mcp>=1.28.1",
  "networkx>=3.6.1",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "uvicorn>=0.51.0",
  "uvloop>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kyo-mcp = "main:main"
